<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SLMS - Forgot Password</title>
    <link rel="stylesheet" href="forgot.css">
</head>
<body>
    <div class="forgot-page">
        <div class="heading">
            <h1>SLMS</h1>
            <p>Smart Library Management System</p>
        </div>
        <div class="forgot-box">
            <h2>Forgot Password</h2>
            <p class="text">Verify your security question to reset your password.</p>
            <form action="resetpassword.html">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"id="email"name="email">
                </div>

                <div class="form-group">
                    <label for="squestion">Security Question</label>
                    <select id="squestion" name="squestion">
                    <option>Select a security question</option>
                    <option>What is your first school name?</option>
                    <option>What is your favourite color?</option>
                    <option>What is your birth city?</option>
                </select>
            </div>
                <div class="form-group">
                    <label for="answer">Security Answer</label>
                    <input type="text"id="answer"name="answer">
                </div>
                <button type="submit">Verify Answer</button>
            </form>
            <div class="back">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
