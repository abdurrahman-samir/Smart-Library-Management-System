<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SLMS - Registration</title>
    <link rel="stylesheet"href="registration.css">
</head>
<body>
    <div align="center">
    <br><br>
        <div>
            <h1>Create Your Account</h1>
            <p>Register as a Student/Member</p>
        </div>
        <br>
        <form>
            <div>
                <label for="fullname">Full Name</label><br>
                <input type="text"id="fullname"name="fullname">
            </div>
            <br>
            <div>
                <label for="email">Email</label><br>
                <input type="email"id="email"name="email">
            </div>
            <br>
            <div>
                <label for="phone">Phone</label><br>
                <input type="phone"id="phone"name="phone">
            </div>
            <br>
            <div>
                <label for="password">Password</label><br>
                <input type="password"id="password" name="password">
            </div>
            <br>
            <div>
                <label for="cpassword">Confirm Password</label><br>
                <input type="password"id="cpassword"name="cpassword">
            </div>
            <br>
            <div>
                <label for="squestion">Security Question</label><br>
                <select id="squestion" name="squestion">
                    <option>Select a security question</option>
                    <option>What is your first school name?</option>
                    <option>What is your favourite color?</option>
                    <option>What is your birth city?</option>
                </select>
            </div>
            <br>
            <div>
                <label for="sanswer">Security Answer</label><br>
                <input type="text" id="sanswer" name="sanswer">
            </div>
            <br>
            <div>
                <p><b>Note: Registration is for Student/Member only.</b></p>
                <p>Admin and Librarian accounts are not public.</p>
            </div>
            <br>
            <div>
                <button type="submit">Register</button>
            </div>
            <br>
            <div>
                Already have an account?
                <a href="login.html">Login</a>
            </div>
        </form>
    </div>
</body>
</html>
